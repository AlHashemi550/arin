<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز قطع الغيار - {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="{{ url_for('index') }}" class="back-btn"><i class="fas fa-arrow-right"></i></a>
            <h1><i class="fas fa-cogs"></i> حجز قطع الغيار</h1>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}"><i class="fas fa-info-circle"></i> {{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <div class="contact-card">
            <i class="fas fa-user-tie"></i>
            <div>
                <h3>بدر الحضرمي</h3>
                <p>مختص قطع الغيار</p>
                <a href="tel:+967773852062" class="phone-link"><i class="fas fa-phone"></i> 773852062</a>
            </div>
        </div>

        <div class="form-container">
            <form method="POST" action="{{ url_for('reserve') }}">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> الاسم الكامل</label>
                    <input type="text" name="name" placeholder="أدخل اسمك" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> رقم الجوال</label>
                    <input type="tel" name="phone" placeholder="مثال: 773852062" required pattern="[0-9]{9}">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-mobile-alt"></i> نوع الجهاز</label>
                    <input type="text" name="device_name" placeholder="مثال: iPhone 14 Pro Max">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-puzzle-piece"></i> اسم القطعة المطلوبة</label>
                    <input type="text" name="part_name" placeholder="مثال: شاشة أصلية - بطارية" required>
                </div>
                <button type="submit" class="btn btn-gold"><i class="fab fa-whatsapp"></i> إرسال الطلب عبر واتساب</button>
            </form>
        </div>

        <div class="footer">
            <p class="dev-name">الهاشمي محمد</p>
            <div class="social-links">
                <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
