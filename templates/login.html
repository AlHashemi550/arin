<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>تسجيل الدخول - أرين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(ellipse at center, #1a1500 0%, #000000 70%);
        }
        
        .container {
            width: 100%;
            max-width: 360px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo svg {
            width: 80px;
            height: 95px;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }
        
        .title {
            font-size: 24px;
            font-weight: 900;
            color: #d4af37;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #0a0a0a;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        
        .form-group input::placeholder {
            color: #555;
        }
        
        .admin-box {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            color: #d4af37;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            border: none;
            border-radius: 50px;
            color: #000;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }
        
        .btn-submit:active {
            transform: scale(0.98);
        }
        
        .register-link {
            display: block;
            text-align: center;
            color: #666;
            text-decoration: none;
            margin-top: 25px;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .register-link span {
            color: #d4af37;
            font-weight: 700;
        }
        
        .register-link:active {
            color: #d4af37;
        }
        
        .hint {
            color: #444;
            font-size: 11px;
            text-align: center;
            margin-top: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f4d03f"/>
                        <stop offset="50%" style="stop-color:#d4af37"/>
                        <stop offset="100%" style="stop-color:#aa8c2c"/>
                    </linearGradient>
                </defs>
                <path d="M50 5 L90 110 L75 110 L65 85 L35 85 L25 110 L10 110 Z" fill="url(#goldGrad)"/>
                <path d="M50 25 L62 70 L38 70 Z" fill="#000"/>
            </svg>
        </div>
        
        <div class="title">تسجيل الدخول</div>
        <div class="subtitle">أهلاً بك في أرين</div>
        
        <form action="{{ url_for('login') }}" method="post">
            <div class="form-group">
                <label>رقم الجوال</label>
                <input type="tel" name="phone" required placeholder="مثال: 783234925" maxlength="15">
            </div>
            
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" placeholder="للعملاء المسجلين">
            </div>
            
            <div class="admin-box">
                <div class="admin-badge">⚡ للأدمن فقط</div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="color: #d4af37;">باسورد الأدمن</label>
                    <input type="password" name="admin_password" placeholder="باسورد خاص بالأدمن">
                </div>
            </div>
            
            <button type="submit" class="btn-submit">دخول</button>
        </form>
        
        <a href="{{ url_for('register') }}" class="register-link">
            ليس لديك حساب؟ <span>سجل الآن</span>
        </a>
        
        <div class="hint">
            الأدمن: اكتب رقمك + باسورد الأدمن فقط<br>
            العميل: اكتب رقمك + كلمة المرور
        </div>
    </div>
</body>
</html>
