<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="{{ url_for('index') }}" class="back-btn"><i class="fas fa-arrow-right"></i></a>
            <h1><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}"><i class="fas fa-info-circle"></i> {{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <div class="form-container">
            <form method="POST">
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> رقم الجوال</label>
                    <input type="tel" name="phone" value="{{ phone }}" placeholder="مثال: 783234925" required pattern="[0-9]{9}">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> كلمة المرور</label>
                    <input type="password" name="password" placeholder="كلمة المرور" required>
                </div>
                {% if is_admin_phone %}
                <div class="form-group">
                    <label><i class="fas fa-user-shield"></i> باسورد الأدمن</label>
                    <input type="password" name="admin_password" placeholder="باسورد الأدمن">
                </div>
                {% endif %}
                <button type="submit" class="btn btn-gold"><i class="fas fa-sign-in-alt"></i> دخول</button>
            </form>
            <div style="text-align: center; margin-top: 20px;">
                <p style="color: var(--text-muted); margin-bottom: 10px;">ليس لديك حساب؟</p>
                <a href="{{ url_for('register') }}" class="btn btn-dark"><i class="fas fa-user-plus"></i> إنشاء حساب</a>
            </div>
        </div>

        <div class="footer">
            <p class="dev-name">الهاشمي محمد</p>
            <div class="social-links">
                <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
