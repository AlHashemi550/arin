<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ - أرين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .error-icon { font-size: 60px; margin-bottom: 20px; }
        .error-title { font-size: 22px; color: #d4af37; margin-bottom: 10px; font-weight: 700; }
        .error-text { color: #888; margin-bottom: 30px; font-size: 14px; }
        .btn-back { padding: 12px 30px; background: linear-gradient(135deg, #d4af37, #aa8c2c); color: #000; border: none; border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <div class="error-icon">⚠️</div>
    <div class="error-title">عذراً، حدث خطأ</div>
    <div class="error-text">{{ error or 'الصفحة غير متوفرة حالياً، حاول مرة أخرى' }}</div>
    <a href="{{ url_for('index') }}" class="btn-back">العودة للرئيسية</a>
</body>
</html>
