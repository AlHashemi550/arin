{% extends "base.html" %}

{% block title %}أجهزتي - أرين{% endblock %}

{% block extra_css %}
<style>
    .devices-page { padding: 20px; padding-bottom: 100px; }
    .devices-header { text-align: center; padding-top: 20px; margin-bottom: 30px; }
    .devices-icon { font-size: 60px; margin-bottom: 10px; }
    .devices-title { font-size: 24px; font-weight: 700; color: #d4af37; }
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: rgba(255,255,255,0.3);
    }
    .empty-icon { font-size: 50px; margin-bottom: 15px; }
    .add-hint {
        background: #0a0a0a;
        border: 1px solid rgba(212, 175, 55, 0.15);
        border-radius: 16px;
        padding: 25px;
        text-align: center;
    }
    .add-hint-icon { font-size: 40px; margin-bottom: 10px; }
    .add-hint-text { font-size: 14px; color: rgba(255,255,255,0.5); }
</style>
{% endblock %}

{% block content %}
<div class="devices-page">
    <div class="devices-header">
        <div class="devices-icon">📱</div>
        <div class="devices-title">أجهزتي</div>
    </div>
    
    <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div>لا توجد أجهزة مسجلة</div>
    </div>
    
    <div class="add-hint" style="margin-top:20px;">
        <div class="add-hint-icon">➕</div>
        <div class="add-hint-text">
            سجل أجهزتك لمتابعة الضمان<br>
            والحصول على تنبيهات التجديد
        </div>
    </div>
</div>
{% endblock %}
