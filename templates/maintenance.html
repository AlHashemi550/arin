<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيانة الجوالات - {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="{{ url_for('index') }}" class="back-btn"><i class="fas fa-arrow-right"></i></a>
            <h1><i class="fas fa-tools"></i> صيانة الجوالات</h1>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}"><i class="fas fa-info-circle"></i> {{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <div class="contact-card">
            <i class="fas fa-wrench"></i>
            <div>
                <h3>المهندس راشد</h3>
                <p>فني صيانة متخصص</p>
                <a href="tel:+967779505979" class="phone-link"><i class="fas fa-phone"></i> 779505979</a>
            </div>
        </div>

        <div class="form-container">
            <form method="POST" action="{{ url_for('maintenance_book') }}">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> الاسم</label>
                    <input type="text" name="name" placeholder="اسمك" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> رقم الجوال</label>
                    <input type="tel" name="phone" placeholder="رقمك" required pattern="[0-9]{9}">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-mobile-alt"></i> نوع الجهاز</label>
                    <input type="text" name="device" placeholder="مثال: Samsung S23 Ultra" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-exclamation-circle"></i> المشكلة</label>
                    <textarea name="issue" rows="3" placeholder="اشرح المشكلة بالتفصيل..." required></textarea>
                </div>
                <button type="submit" class="btn btn-gold"><i class="fab fa-whatsapp"></i> حجز صيانة عبر واتساب</button>
            </form>
        </div>

        <div class="footer">
            <p class="dev-name">الهاشمي محمد</p>
            <div class="social-links">
                <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
