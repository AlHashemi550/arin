<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>AREEN - أرين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .splash-container {
            text-align: center;
            animation: fadeIn 1s ease-in;
        }
        
        .logo-text {
            font-size: 4em;
            font-weight: 700;
            color: #d4af37;
            text-shadow: 0 0 30px rgba(212,175,55,0.5);
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }
        
        .logo-sub {
            font-size: 1.2em;
            color: #d4af37;
            opacity: 0.8;
            margin-bottom: 40px;
        }
        
        .countdown {
            font-size: 3em;
            color: #d4af37;
            font-weight: 700;
            margin: 20px 0;
        }
        
        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(212,175,55,0.2);
            border-radius: 2px;
            margin: 20px auto;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #b8941f);
            width: 0%;
            animation: fillProgress 6s linear forwards;
        }
        
        .dev-name {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1em;
            font-weight: 700;
            color: #e91e8c;
            text-shadow: 0 0 20px rgba(233,30,140,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes fillProgress {
            from { width: 0%; }
            to { width: 100%; }
        }
        
        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.5); }
        }
        
        .fallback-link {
            display: none;
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #d4af37, #b8941f);
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-text">AREEN</div>
        <div class="logo-sub">أرين - المتجر الذكي</div>
        <div class="countdown" id="countdown">6</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <a href="/products" class="fallback-link" id="fallback">الدخول للتطبيق</a>
    </div>
    
    <div class="dev-name">✨ الهاشمي محمد ✨</div>

    <script>
        // WebView compatible countdown
        var count = 6;
        var counter = document.getElementById('countdown');
        var fallback = document.getElementById('fallback');
        
        function updateCount() {
            count--;
            if (counter) counter.textContent = count;
            if (count <= 0) {
                goToProducts();
            }
        }
        
        function goToProducts() {
            try {
                window.location.href = '/products';
            } catch(e) {
                // Fallback for WebView
                document.body.innerHTML = '<div style="text-align:center;padding:50px;"><h1 style="color:#d4af37;">AREEN</h1><p style="color:#fff;">جارِ التحميل...</p><a href="/products" style="display:inline-block;margin-top:20px;padding:15px 40px;background:linear-gradient(135deg,#d4af37,#b8941f);color:#000;text-decoration:none;border-radius:30px;font-weight:700;">الدخول للتطبيق</a></div>';
            }
        }
        
        // Start countdown
        var timer = setInterval(updateCount, 1000);
        
        // Fallback: show button after 3 seconds
        setTimeout(function() {
            if (fallback) fallback.style.display = 'inline-block';
        }, 3000);
        
        // Auto redirect after 6 seconds
        setTimeout(goToProducts, 6000);
    </script>
</body>
</html>
