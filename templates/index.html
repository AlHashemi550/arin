<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أرين - AREEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family:'Cairo',sans-serif;
            background:#000;
            overflow:hidden;
            height:100vh;
            width:100vw;
        }

        #splash {
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background:radial-gradient(ellipse at center, #0d0d1a 0%, #000 70%);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            z-index:9999;
            transition:all 1.2s cubic-bezier(0.7, 0, 0.3, 1);
        }

        #splash.hide {
            transform:translateY(-100%) rotateX(20deg);
            opacity:0;
            pointer-events:none;
        }

        .glow-bg {
            position:absolute;
            width:350px; height:350px;
            background:radial-gradient(circle, rgba(212,175,55,0.12) 0%, transparent 70%);
            border-radius:50%;
            animation:pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { transform:scale(1); opacity:0.5; }
            50% { transform:scale(1.3); opacity:0.8; }
        }

        .logo-container {
            position:relative;
            z-index:2;
            animation:sway 3s ease-in-out infinite;
            transform-origin:center bottom;
        }
        
        @keyframes sway {
            0%,100% { transform:rotate(-2deg) translateY(0); }
            25% { transform:rotate(2deg) translateY(-10px); }
            50% { transform:rotate(-1deg) translateY(-5px); }
            75% { transform:rotate(1deg) translateY(-8px); }
        }

        #splash.falling .logo-container {
            animation:fallDrop 1s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards !important;
        }
        @keyframes fallDrop {
            0% { transform:rotate(0deg) translateY(0); opacity:1; }
            40% { transform:rotate(5deg) translateY(20px); }
            100% { transform:rotate(15deg) translateY(150vh); opacity:0; }
        }

        .splash-img {
            width:300px;
            max-width:85vw;
            border-radius:24px;
            box-shadow:0 25px 80px rgba(0,0,0,0.6);
            filter:drop-shadow(0 0 40px rgba(212,175,55,0.25));
        }

        /* اسم المطور في الأسفل */
        .developer {
            position:absolute;
            bottom:100px;
            left:50%;
            transform:translateX(-50%);
            color:#e91e8c;
            font-size:0.95rem;
            font-weight:700;
            text-shadow:0 0 20px rgba(233,30,140,0.4);
            z-index:2;
            letter-spacing:1px;
            animation:glowText 2s ease-in-out infinite;
        }
        @keyframes glowText {
            0%,100% { text-shadow:0 0 10px rgba(233,30,140,0.3); }
            50% { text-shadow:0 0 25px rgba(233,30,140,0.6), 0 0 40px rgba(233,30,140,0.2); }
        }

        .progress-container {
            position:absolute;
            bottom:55px;
            left:50%;
            transform:translateX(-50%);
            width:220px;
            height:3px;
            background:rgba(255,255,255,0.08);
            border-radius:10px;
            overflow:hidden;
        }
        .progress-bar {
            height:100%;
            width:0%;
            background:linear-gradient(90deg, #d4af37, #f0d878, #d4af37);
            border-radius:10px;
            animation:fillBar 6s linear forwards;
            box-shadow:0 0 15px rgba(212,175,55,0.5);
        }
        @keyframes fillBar {
            0% { width:0%; }
            100% { width:100%; }
        }

        .countdown {
            position:absolute;
            bottom:70px;
            color:#d4af37;
            font-size:0.9rem;
            font-weight:700;
            letter-spacing:3px;
            opacity:0.8;
            font-variant-numeric:tabular-nums;
        }

        .stars {
            position:fixed;
            top:0; left:0; width:100%; height:100%;
            pointer-events:none;
            z-index:1;
        }
        .star {
            position:absolute;
            width:2px; height:2px;
            background:#d4af37;
            border-radius:50%;
            animation:twinkle var(--duration) ease-in-out infinite;
            opacity:0;
        }
        @keyframes twinkle {
            0%,100% { opacity:0; transform:scale(0); }
            50% { opacity:var(--opacity); transform:scale(1); }
        }

        #products-frame {
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            border:none;
            width:100%; height:100%;
            opacity:0;
            transition:opacity 1.5s ease;
            z-index:1;
        }
        #products-frame.show {
            opacity:1;
            z-index:10;
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div id="splash">
        <div class="glow-bg"></div>
        
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/splash.png') }}" 
                 alt="أرين - AREEN" 
                 class="splash-img"
                 onerror="this.style.display='none'; document.querySelector('.logo-container').innerHTML='<div style=\'font-size:4rem;color:#d4af37;text-shadow:0 0 30px rgba(212,175,55,0.5);font-weight:900;\'>AREEN</div>';">
        </div>

        <div class="developer">✨ الهاشمي محمد ✨</div>

        <div class="countdown" id="countdown">00:06</div>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <iframe id="products-frame" src="/products"></iframe>

    <script>
        const starsContainer = document.getElementById('stars');
        for(let i=0; i<<60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.setProperty('--opacity', Math.random() * 0.8 + 0.2);
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }

        let seconds = 6;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds--;
            if(seconds > 0) {
                countdownEl.textContent = '00:0' + seconds;
            } else {
                countdownEl.textContent = 'انطلق!';
                clearInterval(timer);
            }
        }, 1000);

        setTimeout(() => {
            const splash = document.getElementById('splash');
            const frame = document.getElementById('products-frame');
            
            splash.classList.add('falling');
            
            setTimeout(() => {
                splash.classList.add('hide');
                frame.classList.add('show');
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 1500);
            }, 800);
            
        }, 6000);
    </script>
</body>
</html>
