<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أرين - AREEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000000;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .welcome-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: radial-gradient(ellipse at center top, #1a1500 0%, #000000 70%);
        }
        
        /* شعار A الذهبي ثلاثي الأبعاد */
        .logo-container {
            position: relative;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .logo-svg {
            width: 140px;
            height: 160px;
            filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.6)) 
                    drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }
        
        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(212,175,55,0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }
        
        .welcome-text {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .welcome-sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .app-name-ar {
            font-size: 52px;
            font-weight: 900;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        
        .app-name-en {
            font-size: 24px;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }
        
        .app-desc {
            color: #aaa;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 40px;
        }
        
        .app-desc span {
            color: #d4af37;
            font-weight: 600;
        }
        
        /* زر تسجيل الدخول الزجاجي */
        .btn-glass {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 280px;
            padding: 16px 30px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 50px;
            color: #d4af37;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        
        .btn-glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-glass:hover::before {
            left: 100%;
        }
        
        .btn-glass:active {
            transform: scale(0.98);
        }
        
        .register-link {
            color: #888;
            font-size: 14px;
            text-decoration: none;
            margin-top: 10px;
            transition: color 0.3s;
        }
        
        .register-link span {
            color: #d4af37;
            font-weight: 600;
        }
        
        .register-link:active {
            color: #d4af37;
        }
        
        /* صور الخلفية الشفافة */
        .bg-phones {
            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
            opacity: 0.15;
            z-index: 0;
        }
        
        .bg-phones img {
            max-height: 200px;
            margin: 0 -20px;
        }
        
        /* اسم المطور */
        .developer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }
        
        .developer-name {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, #e91e8c, #ff69b4, #e91e8c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(233, 30, 140, 0.3);
            animation: shimmer 2s linear infinite;
            background-size: 200% auto;
        }
        
        @keyframes shimmer {
            to { background-position: 200% center; }
        }
        
        .sparkle {
            color: #e91e8c;
            animation: sparkle 1.5s ease-in-out infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="logo-container">
            <div class="logo-glow"></div>
            <svg class="logo-svg" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#aa8c2c;stop-opacity:1" />
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <!-- حرف A ثلاثي الأبعاد -->
                <path d="M50 5 L90 110 L75 110 L65 85 L35 85 L25 110 L10 110 Z" 
                      fill="url(#goldGrad)" stroke="#f4d03f" stroke-width="1" filter="url(#glow)"/>
                <path d="M50 25 L62 70 L38 70 Z" fill="#000"/>
                <!-- حلقة تحت -->
                <ellipse cx="50" cy="115" rx="35" ry="3" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
                <text x="50" y="108" text-anchor="middle" fill="#d4af37" font-size="8" font-weight="bold" letter-spacing="2">AREEN</text>
            </svg>
        </div>
        
        <div class="welcome-text">
            <div class="welcome-sub">أهلاً بكم في تطبيق</div>
            <div class="app-name-ar">أرين</div>
            <div class="app-name-en">A R E E N</div>
            <div class="app-desc">
                متجرك الذكي للجوالات<br>
                <span>صيانة | برمجة | قطع أصلية</span>
            </div>
        </div>
        
        <a href="{{ url_for('login') }}" class="btn-glass">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            تسجيل الدخول
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </a>
        
        <a href="{{ url_for('register') }}" class="register-link">
            ليس لديك حساب؟ <span>سجل الآن</span>
        </a>
    </div>
    
    <div class="bg-phones">
        <svg width="120" height="200" viewBox="0 0 120 200" opacity="0.3">
            <rect x="20" y="10" width="80" height="180" rx="15" fill="none" stroke="#d4af37" stroke-width="2"/>
            <rect x="25" y="20" width="70" height="150" rx="5" fill="rgba(212,175,55,0.05)"/>
        </svg>
        <svg width="120" height="200" viewBox="0 0 120 200" opacity="0.3">
            <rect x="20" y="10" width="80" height="180" rx="20" fill="none" stroke="#d4af37" stroke-width="2"/>
            <rect x="25" y="25" width="70" height="140" rx="10" fill="rgba(212,175,55,0.05)"/>
        </svg>
    </div>
    
    <div class="developer">
        <div class="developer-name">
            <span class="sparkle">✨</span> الهاشمي محمد <span class="sparkle">✨</span>
        </div>
    </div>
</body>
</html>
