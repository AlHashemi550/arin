<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أرين | AREEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
        body.welcome-page{background:#000;min-height:100vh;overflow-x:hidden;position:relative}
        .welcome-bg{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8vh;text-align:center;z-index:1}
        .spotlight{position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:300px;height:500px;background:radial-gradient(ellipse,rgba(212,175,55,0.15) 0%,transparent 70%);pointer-events:none;z-index:0}
        .logo-container{position:relative;z-index:2;margin-bottom:2vh;animation:float 3s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        .arin-logo{width:160px;height:auto;filter:drop-shadow(0 0 20px rgba(212,175,55,0.4))}
        .welcome-subtitle{color:rgba(255,255,255,0.6);font-size:1rem;margin-bottom:0.5vh;position:relative;z-index:2}
        .welcome-title{color:#d4af37;font-size:3.5rem;font-weight:900;margin-bottom:0.5vh;text-shadow:0 0 30px rgba(212,175,55,0.5);position:relative;z-index:2;line-height:1.2}
        .welcome-en{color:#d4af37;font-size:1.2rem;font-weight:700;letter-spacing:8px;margin-bottom:2vh;opacity:0.8;position:relative;z-index:2}
        .welcome-desc{color:rgba(255,255,255,0.7);font-size:1.1rem;line-height:1.8;margin-bottom:4vh;position:relative;z-index:2}
        .welcome-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.3);color:#d4af37;padding:14px 40px;border-radius:50px;font-size:1.1rem;font-weight:700;text-decoration:none;backdrop-filter:blur(10px);transition:all 0.3s;position:relative;z-index:2;margin-bottom:2vh;overflow:hidden}
        .welcome-btn:hover{background:rgba(212,175,55,0.2);transform:scale(1.05);box-shadow:0 0 30px rgba(212,175,55,0.3)}
        .welcome-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:0.5s}
        .welcome-btn:hover::before{left:100%}
        .welcome-register{color:rgba(255,255,255,0.5);font-size:0.95rem;position:relative;z-index:2;margin-bottom:3vh}
        .welcome-register a{color:#d4af37;text-decoration:none;font-weight:700}
        .phone-showcase{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:20px;pointer-events:none;z-index:1;opacity:0.6}
        .phone-img{max-height:25vh;width:auto;filter:drop-shadow(0 0 10px rgba(212,175,55,0.2))}
        .phone-img.samsung{transform:rotate(-5deg) translateX(20px)}
        .phone-img.iphone{transform:rotate(5deg) translateX(-20px)}
        .dev-credit{position:relative;z-index:2;color:#e91e8c;font-size:0.9rem;font-weight:700;margin-top:auto;padding-bottom:3vh;text-align:center}
        .dev-credit .dev-name{background:linear-gradient(45deg,#e91e8c,#ff69b4,#e91e8c);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 3s ease infinite;font-weight:900;font-size:1rem}
        @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        .dev-stars{color:#ffd700;font-size:1.1rem;margin:0 5px;animation:sparkle 1.5s ease-in-out infinite}
        @keyframes sparkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(1.2)}}
    </style>
</head>
<body class="welcome-page">
    <div class="welcome-bg">
        <div class="spotlight"></div>
        
        <div class="logo-container">
            <svg class="arin-logo" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f9e076;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#aa8c2c;stop-opacity:1" />
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <path d="M100 20 L180 180 L20 180 Z" fill="url(#goldGrad)" stroke="#f9e076" stroke-width="2" filter="url(#glow)"/>
                <path d="M100 20 L180 180 L140 180 L100 100 Z" fill="rgba(255,255,255,0.2)"/>
                <text x="100" y="155" text-anchor="middle" fill="#000" font-size="70" font-weight="900" font-family="Cairo">A</text>
                <ellipse cx="100" cy="195" rx="70" ry="12" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6">
                    <animate attributeName="rx" values="70;75;70" dur="3s" repeatCount="indefinite"/>
                </ellipse>
                <text x="100" y="225" text-anchor="middle" fill="#d4af37" font-size="18" font-weight="700" font-family="Cairo" letter-spacing="8">AREEN</text>
            </svg>
        </div>

        <p class="welcome-subtitle">أهلاً بكم في تطبيق</p>
        <h1 class="welcome-title">أرين</h1>
        <p class="welcome-en">A R E E N</p>
        <p class="welcome-desc">متجرك الذكي للجوالات<br>صيانة | برمجة | قطع أصلية</p>

        <a href="{{ url_for('login') }}" class="welcome-btn">
            <span>تسجيل الدخول</span>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </a>

        <p class="welcome-register">
            ليس لديك حساب؟ <a href="{{ url_for('register') }}">سجل الآن</a>
        </p>

        <div class="phone-showcase">
            <img src="https://pngimg.com/uploads/samsung_phone/samsung_phone_PNG10.png" class="phone-img samsung" alt="Samsung">
            <img src="https://pngimg.com/uploads/iphone_14/iphone_14_PNG2.png" class="phone-img iphone" alt="iPhone">
        </div>

        <div class="dev-credit">
            <span class="dev-stars">✨</span>
            <span class="dev-name">الهاشمي محمد</span>
            <span class="dev-stars">✨</span>
        </div>
    </div>
</body>
</html>
