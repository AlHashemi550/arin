<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كود التحقق - {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="{{ url_for('register') }}" class="back-btn"><i class="fas fa-arrow-right"></i></a>
            <h1><i class="fas fa-shield-alt"></i> كود التحقق</h1>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}"><i class="fas fa-info-circle"></i> {{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        <div class="form-container">
            <p style="color: var(--text-muted); margin-bottom: 20px; text-align: center;">تم إرسال كود التحقق لواتساب <strong style="color: var(--gold);">{{ phone }}</strong></p>
            <a href="{{ wa_url }}" target="_blank" class="btn btn-success" style="margin-bottom: 20px;"><i class="fab fa-whatsapp"></i> فتح واتساب</a>
            <form method="POST">
                <input type="hidden" name="step" value="2">
                <input type="hidden" name="phone" value="{{ phone }}">
                <div class="form-group">
                    <label><i class="fas fa-key"></i> كود التحقق</label>
                    <input type="text" name="otp" placeholder="أدخل الكود" required maxlength="4">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> الاسم الكامل</label>
                    <input type="text" name="name" placeholder="اسمك" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> كلمة المرور</label>
                    <input type="password" name="password" placeholder="كلمة مرور قوية" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-gift"></i> كود الإحالة (اختياري)</label>
                    <input type="text" name="referral_code" placeholder="كود صديقك">
                </div>
                <button type="submit" class="btn btn-gold"><i class="fas fa-check"></i> تأكيد التسجيل</button>
            </form>
        </div>
        <div class="footer">
            <p class="dev-name">الهاشمي محمد</p>
        </div>
    </div>
</body>
</html>
