<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كود التحقق - أرين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(ellipse at center, #1a1500 0%, #000000 70%);
        }
        
        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        
        .otp-icon {
            font-size: 60px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }
        
        .otp-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        
        .otp-code {
            font-size: 56px;
            font-weight: 900;
            color: #d4af37;
            letter-spacing: 12px;
            margin: 15px 0;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            font-family: 'Courier New', monospace;
        }
        
        .otp-phone {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        
        .otp-phone span {
            color: #d4af37;
            font-weight: 700;
        }
        
        .warning-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #f87171;
            font-size: 13px;
            font-weight: 600;
        }
        
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: all 0.3s;
        }
        
        .btn-whatsapp:active {
            transform: scale(0.98);
        }
        
        .btn-continue {
            display: block;
            width: 100%;
            padding: 14px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #d4af37;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .btn-continue:active {
            background: rgba(212, 175, 55, 0.2);
        }
        
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212,175,55,0.3), transparent);
            margin: 20px 0;
        }
        
        .hint {
            color: #555;
            font-size: 12px;
            margin-top: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="otp-icon">📱</div>
        <div class="otp-label">كود التحقق من أرين</div>
        <div class="otp-code">{{ otp }}</div>
        <div class="otp-phone">للرقم: <span>967{{ phone }}</span></div>
        
        <div class="warning-box">
            ⚠️ لا تشاركه مع أحد
        </div>
        
        <a href="{{ whatsapp_url }}" class="btn-whatsapp" target="_blank">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
            </svg>
            فتح واتساب وإرسال الكود
        </a>
        
        <div class="divider"></div>
        
        <a href="{{ url_for('verify_otp') }}" class="btn-continue">
            تم الإرسال → أكمل التسجيل
        </a>
        
        <div class="hint">
            اضغط على الزر الأخضر لفتح واتساب<br>
            ثم ارسل الكود للعميل يدوياً
        </div>
    </div>
</body>
</html>
