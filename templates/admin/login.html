<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الأدمن - AREEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { 
            background: #000; min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
        }
        .login-box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 20px; padding: 40px; width: 90%; max-width: 400px;
            text-align: center;
        }
        .logo { font-size: 3em; margin-bottom: 10px; }
        h2 { color: #d4af37; margin-bottom: 30px; font-size: 1.5em; }
        input {
            width: 100%; padding: 15px; margin: 10px 0;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(212,175,55,0.3);
            border-radius: 10px; color: #fff; font-size: 1.1em; text-align: center;
        }
        input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 15px rgba(212,175,55,0.3); }
        button {
            width: 100%; padding: 15px; margin-top: 20px;
            background: linear-gradient(135deg, #d4af37, #b8941f);
            border: none; border-radius: 10px; color: #000;
            font-size: 1.1em; font-weight: 700; cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(212,175,55,0.4); }
        .error { color: #e91e8c; margin-top: 15px; }
        .back { color: #888; margin-top: 20px; text-decoration: none; display: block; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🔐</div>
        <h2>لوحة التحكم</h2>
        <form method="POST">
            <input type="password" name="password" placeholder="أدخل كلمة السر" required autofocus>
            <button type="submit">دخول</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="error">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <a href="/products" class="back">← الرجوع للمتجر</a>
    </div>
</body>
</html>
