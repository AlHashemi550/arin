<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعنا - AREEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #000; color: #fff; min-height: 100vh; padding-bottom: 100px; }
        
        .header {
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            padding: 20px; text-align: center; border-bottom: 2px solid #d4af37;
            position: sticky; top: 0; z-index: 100;
        }
        .header h1 { color: #d4af37; }
        .back { position: absolute; left: 20px; top: 20px; color: #d4af37; text-decoration: none; font-size: 1.5em; }
        
        .map-container {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 20px; margin: 20px 15px; padding: 30px; text-align: center;
        }
        .pin-icon { font-size: 5em; margin-bottom: 20px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        
        .shop-name { color: #d4af37; font-size: 1.5em; font-weight: 700; margin-bottom: 10px; }
        .shop-address {
            color: #ccc; line-height: 2; font-size: 1.1em;
            background: rgba(212,175,55,0.05); padding: 20px; border-radius: 15px;
            margin: 20px 0;
        }
        .shop-address strong { color: #d4af37; }
        
        .map-btn {
            display: inline-block; padding: 15px 40px;
            background: linear-gradient(135deg, #d4af37, #b8941f);
            color: #000; text-decoration: none; border-radius: 30px;
            font-weight: 700; font-size: 1.1em; margin-top: 20px;
            box-shadow: 0 5px 20px rgba(212,175,55,0.3);
            transition: all 0.3s;
        }
        .map-btn:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(212,175,55,0.5); }
        
        .best-choice {
            margin-top: 30px; padding: 20px;
            background: linear-gradient(135deg, rgba(40,167,69,0.1), rgba(40,167,69,0.05));
            border: 1px solid rgba(40,167,69,0.3); border-radius: 15px;
        }
        .best-choice-text { color: #28a745; font-size: 1.2em; font-weight: 700; }
        .heart { font-size: 1.5em; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        
        .dev-footer {
            text-align: center; padding: 30px 20px;
            background: linear-gradient(90deg, transparent, rgba(233,30,140,0.1), transparent);
        }
        .dev-name {
            font-size: 1.2em; font-weight: 700;
            background: linear-gradient(90deg, #e91e8c, #ff6b9d, #e91e8c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(233,30,140,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow { from { filter: brightness(1); } to { filter: brightness(1.3); } }
        
        .exit-btn {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #d4af37, #b8941f);
            color: #000; padding: 12px 40px; border-radius: 30px;
            font-weight: 700; cursor: pointer; border: none; z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="javascript:history.back()" class="back">→</a>
        <h1>📍 موقع المحل</h1>
    </div>

    <div class="map-container">
        <div class="pin-icon">📍</div>
        <div class="shop-name">🏪 محل الراشد للجوالات</div>
        <div class="shop-address">
            <div><strong>الدولة:</strong> اليمن 🇾🇪</div>
            <div><strong>المحافظة:</strong> المهرة</div>
            <div><strong>المدينة:</strong> الغيضة</div>
            <div><strong>المنطقة:</strong> الهنجر - سوق بن خودم</div>
        </div>
        
        <a href="https://www.google.com/maps/search/?api=1&query=16.9397,52.1763" class="map-btn" target="_blank">
            🗺️ موقعنا على الخريطة
        </a>
        
        <div class="best-choice">
            <div class="best-choice-text">
                ✅ خيارك الأفضل <span class="heart">🤍</span>
            </div>
        </div>
    </div>

    <div class="dev-footer">
        <div class="dev-name">✨ الهاشمي محمد ✨</div>
    </div>

    <button class="exit-btn" onclick="goHome()">🏠 الخروج للرئيسية</button>

    <script>
        function goHome() { window.location.href = '/'; }
    </script>
</body>
</html>
