<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برمجة الجوالات - {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="{{ url_for('index') }}" class="back-btn"><i class="fas fa-arrow-right"></i></a>
            <h1><i class="fas fa-code"></i> برمجة الجوالات</h1>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}"><i class="fas fa-info-circle"></i> {{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <div class="contact-card">
            <i class="fas fa-laptop-code"></i>
            <div>
                <h3>المبرمج محمد</h3>
                <p>مختص برمجة وسوفت وير</p>
                <a href="tel:+967783234925" class="phone-link"><i class="fas fa-phone"></i> 783234925</a>
            </div>
        </div>

        <div class="form-container">
            <form method="POST" action="{{ url_for('programming_book') }}">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> الاسم</label>
                    <input type="text" name="name" placeholder="اسمك" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> رقم الجوال</label>
                    <input type="tel" name="phone" placeholder="رقمك" required pattern="[0-9]{9}">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-list"></i> نوع الخدمة</label>
                    <select name="service" required>
                        <option value="">اختر الخدمة</option>
                        <option value="فلاش">فلاش (تفليش)</option>
                        <option value="فك شفرة">فك شفرة</option>
                        <option value="تخطي حساب">تخطي حساب Google/Apple</option>
                        <option value="تعريب">تعريب الجهاز</option>
                        <option value="روت">عمل روت</option>
                        <option value="استرجاع">استرجاع بيانات</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-comment"></i> التفاصيل</label>
                    <textarea name="details" rows="3" placeholder="تفاصيل إضافية..."></textarea>
                </div>
                <button type="submit" class="btn btn-gold"><i class="fab fa-whatsapp"></i> طلب برمجة عبر واتساب</button>
            </form>
        </div>

        <div class="footer">
            <p class="dev-name">الهاشمي محمد</p>
            <div class="social-links">
                <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
